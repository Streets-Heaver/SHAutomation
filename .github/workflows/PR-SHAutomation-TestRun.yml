name: Windows UI Tests

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v2
      - name: Install .NET Core
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: '6.0.x'
      - name: Build tests
        run: |
          dotnet build **/*.csproj
      - name: Run tests
        run: |
          dotnet test **/*.csproj